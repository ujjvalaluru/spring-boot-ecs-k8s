apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}-${VERSION}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  replicas: 4
  selector:
    matchLabels:
      app: ${APP_NAME}
      version: ${VERSION_LABEL}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
        version: ${VERSION_LABEL}
    spec:
      containers:
        - name: ${APP_NAME}
          image: ${DOCKER_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "${SPRING_PROFILE}"
            - name: JAVA_OPTS
              value: "${JAVA_OPTS}"
          readinessProbe:
            httpGet:
              path: ${READINESS_PATH}
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: 
              path: ${LIVENESS_PATH}
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3


