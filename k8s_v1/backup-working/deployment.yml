apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  replicas: 4
  selector:
    matchLabels:
      app: users
      version: V1
  template:
    metadata:
      labels:
        version: V1
        app: users
    spec:
      containers:
        - name: user
          image: user-app:1.0   # local image
          #image: user-app:2.0
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local-docker"
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: 
              path: /actuator/info
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3


